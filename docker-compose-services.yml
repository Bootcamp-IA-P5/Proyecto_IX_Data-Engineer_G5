# ============================================================
# DOCKER COMPOSE - SERVICIOS DE APLICACIÓN
# ============================================================
# Este archivo define los microservicios que procesan datos:
# - kafka-consumer: Consume mensajes de Kafka
# - data-processor: Procesa y transforma datos (por implementar)
# - mongo-persister: Guarda datos en MongoDB (por implementar)
# - sql-persister: Guarda datos en PostgreSQL (por implementar)
# ============================================================

version: '3.8'

services:

  # ----------------------------------------------------------
  # KAFKA CONSUMER
  # ----------------------------------------------------------
  # Servicio que consume mensajes del topic de Kafka
  # Lee en tiempo real y procesa diferentes tipos de datos
  # ----------------------------------------------------------
  kafka-consumer:
    # Construir desde el directorio del servicio
    build:
      context: ./Estructura/services/kafka-consumer
      dockerfile: dockerfile

    # Nombre fijo del contenedor
    container_name: kafka-consumer

    # Cargar variables de entorno desde .env
    env_file:
      - ./Estructura/services/kafka-consumer/.env

    # Dependencias: requiere que Kafka esté disponible
    # NOTA: 'kafka' debe estar definido en docker-compose-kafka.yml
    #depends_on:
    #  - kafka

    # Red compartida con Kafka
    networks:
      - kafka-net

    # Política de reinicio: siempre reiniciar si falla
    restart: unless-stopped

    # Logging configurado
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Healthcheck (definido en Dockerfile)
    # Se verifica automáticamente cada 30s

  # ----------------------------------------------------------
  # MONGODB
  # ----------------------------------------------------------
  # Base de datos NoSQL para almacenar datos crudos de Kafka
  # ----------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: hrpro-mongodb
    restart: always
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongodb_data:/data/db
    networks:
      - services-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------
  # MONGO VIEWER (Mongo Express)
  # ----------------------------------------------------------
  # Interfaz web para administrar MongoDB
  # Acceso: http://localhost:8081
  # ----------------------------------------------------------
  mongo-viewer:
    image: mongo-express:latest
    container_name: hrpro-mongo-viewer
    restart: always
    ports:
      - "${MONGO_VIEWER_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongo
    networks:
      - services-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------
  # MONGO PERSISTER
  # ----------------------------------------------------------
  # Servicio que guarda datos crudos de Kafka en MongoDB
  # Consume del topic "probando" y persiste en hrpro_db.raw_messages
  # ----------------------------------------------------------
  mongo-persister:
    build:
      context: ./Estructura/services/mongo-persister
      dockerfile: Dockerfile

    container_name: mongo-persister

    # Variables explícitas
    environment:
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-mongo-persister-group}
      KAFKA_AUTO_OFFSET_RESET: ${KAFKA_AUTO_OFFSET_RESET:-earliest}
      
      # MongoDB
      MONGO_URI: ${MONGO_URI}
      MONGO_DATABASE: ${MONGO_DATABASE}
      MONGO_COLLECTION: ${MONGO_COLLECTION:-raw_messages}
      
      # Config
      MONGO_BATCH_SIZE: ${MONGO_BATCH_SIZE:-100}
      STATS_INTERVAL: ${STATS_INTERVAL:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    
    
    # Requiere Kafka y MongoDB
    depends_on:
    #  - kafka
      - mongo

    # Conectado a ambas redes: Kafka y servicios internos
    networks:
      - kafka-net
      - services-net

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------
  # DATA PROCESSOR
  # ----------------------------------------------------------
  # Servicio que agrupa datos crudos de MongoDB (Issue #6)
  # Lee raw_messages, agrupa por persona, guarda en aggregated_data
  # ----------------------------------------------------------
  data-processor:
    build:
      context: ./Estructura/services/data-processor
      dockerfile: Dockerfile

    container_name: data-processor

    # Variables explícitas (como mongo-persister)
    environment:
      # MongoDB
      MONGO_URI: ${MONGO_URI}
      MONGO_DATABASE: ${MONGO_DATABASE}
      RAW_COLLECTION: ${RAW_COLLECTION:-raw_messages}
      AGGREGATED_COLLECTION: ${AGGREGATED_COLLECTION:-aggregated_data}
      
      # Config de procesamiento
      BATCH_SIZE: ${BATCH_SIZE:-1000}
      PROCESSING_INTERVAL: ${PROCESSING_INTERVAL:-10}
      GROUPING_WINDOW: ${GROUPING_WINDOW:-60}
      STATS_INTERVAL: ${STATS_INTERVAL:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    
    # Requiere MongoDB y mongo-persister
    depends_on:
      - mongo
      - mongo-persister

    # Red de servicios internos
    networks:
      - services-net

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # ----------------------------------------------------------
    # SQL PERSISTER (Por implementar)
    # ----------------------------------------------------------
    # Servicio que guarda datos en PostgreSQL
    # ----------------------------------------------------------
    # sql-persister:
    #   build:
    #     context: ./Estructura/services/sql-persister
    #     dockerfile: Dockerfile
    #   container_name: sql-persister
    #   env_file:
    #     - ./Estructura/services/sql-persister/.env
    #   depends_on:
    #     - kafka-consumer
    #   networks:
    #     - kafka-net
    #   restart: unless-stopped

    # ============================================================
    # REDES
    # ============================================================
    # - kafka-net: red externa para comunicación con Kafka
    # - services-net: red interna para comunicación entre servicios
    # ============================================================
networks:
  kafka-net:
    external: true
    name: kafka-net
  
  services-net:
    driver: bridge
    name: services-net

# ============================================================
# VOLÚMENES
# ============================================================
volumes:
  mongodb_data:
    driver: local

# ============================================================
# CÓMO USAR ESTE ARCHIVO
# ============================================================
# 0. Configura las variables de entorno:
#    cp .env.example .env
#    # Edita .env con tus credenciales reales
#
# 1. Asegúrate de que docker-compose-kafka.yml esté corriendo:
#    docker-compose -f docker-compose-kafka.yml up -d
#
# 2. Levanta los servicios de aplicación:
#    docker-compose -f docker-compose-services.yml up -d
#
# 3. Ver logs de servicios:
#    docker-compose -f docker-compose-services.yml logs -f kafka-consumer
#    docker-compose -f docker-compose-services.yml logs -f mongo-persister
#
# 4. Acceder a Mongo Viewer:
#    http://localhost:8081
#
# 5. Detener servicios:
#    docker-compose -f docker-compose-services.yml down
# ============================================================
