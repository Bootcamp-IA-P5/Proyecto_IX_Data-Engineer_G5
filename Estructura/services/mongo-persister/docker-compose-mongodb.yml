# Ejemplo de configuración para agregar al docker-compose.yml

# NOTA: Este fragmento debe agregarse al docker-compose.yml existente
# que ya tiene Kafka configurado.

services:
  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: hrpro-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: hrpro_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - hrpro-network

  # Mongo Express - Interfaz web para MongoDB
  mongo-express:
    image: mongo-express:latest
    container_name: hrpro-mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongodb
    networks:
      - hrpro-network

volumes:
  mongodb_data:
    driver: local

networks:
  hrpro-network:
    driver: bridge
