[pytest]
# ============================================================
# PATHS Y PATRONES
# ============================================================
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ============================================================
# DOTENV
# ============================================================
env_files = 
    #../../../.env
    ../.env.tests
    

# ============================================================
# OPCIONES POR DEFECTO
# ============================================================
addopts = 
    # Coverage
    --cov=src
    --cov-report=term-missing:skip-covered
    --cov-report=html
    #--cov-fail-under=50
    
    # Output detallado: línea por línea con barra + emojis
    -v
    --emoji
    
    # Traceback corto
    --tb=short
    
    # Colores
    --color=yes
    
    # Strict markers
    --strict-markers
    
    # Mostrar duración de tests lentos (> 1s)
    --durations=5
    
    # Warnings
    -W ignore::DeprecationWarning

# ============================================================
# MARKERS
# ============================================================
markers =
    unit: Tests unitarios (no requieren servicios externos)
    integration: Tests de integración (requieren MongoDB/Kafka reales)
    slow: Tests lentos (> 1 segundo)
    persistence: Tests de persistencia en MongoDB
    performance: Tests de rendimiento y benchmarking


# ============================================================
# TIMEOUTS
# ============================================================
timeout = 60
timeout_method = thread



# ============================================================
# COVERAGE CONFIGURATION
# ============================================================
[coverage:run]
# No omitir nada - queremos cubrir todo el código fuente
branch = True
source = src/

[coverage:report]
# Excluir líneas con comentarios específicos
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod